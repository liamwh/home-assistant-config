---
- alias: "Adaptive lighting: turn on and off switches"
  trigger:
    - platform: state
      entity_id: input_select.sleep_mode
    - platform: homeassistant
      event: start # in case the states aren't properly restored
  variables:
    sleep_mode: "{{ states('input_select.sleep_mode') }}"
  action:
    choose:
      - conditions: "{{ sleep_mode == 'off' }}"
        sequence:
          - service: switch.turn_off
            entity_id:
              - switch.adaptive_lighting_sleep_mode_living_room
              - switch.adaptive_lighting_sleep_mode_bedroom
              - switch.adaptive_lighting_sleep_mode_kitchen
              - switch.adaptive_lighting_sleep_mode_hallway
              - switch.adaptive_lighting_sleep_mode_bathroom
              - switch.adaptive_lighting_sleep_mode_toilet
              - switch.adaptive_lighting_sleep_mode_office
              - switch.adaptive_lighting_sleep_mode_staircase

      - conditions: "{{ sleep_mode == 'half' }}"
        sequence:
          - service: switch.turn_off
            entity_id:
              - switch.adaptive_lighting_sleep_mode_living_room

          - service: switch.turn_on
            entity_id:
              - switch.adaptive_lighting_sleep_mode_bedroom
              - switch.adaptive_lighting_sleep_mode_toilet
              - switch.adaptive_lighting_sleep_mode_kitchen
              - switch.adaptive_lighting_sleep_mode_hallway
              - switch.adaptive_lighting_sleep_mode_bathroom
              - switch.adaptive_lighting_sleep_mode_toilet
              - switch.adaptive_lighting_sleep_mode_office
              - switch.adaptive_lighting_sleep_mode_staircase

      - conditions: "{{ sleep_mode == 'on' }}"
        sequence:
          - service: switch.turn_on
            entity_id:
              - switch.adaptive_lighting_sleep_mode_living_room
              - switch.adaptive_lighting_sleep_mode_bedroom
              - switch.adaptive_lighting_sleep_mode_kitchen
              - switch.adaptive_lighting_sleep_mode_hallway
              - switch.adaptive_lighting_sleep_mode_bathroom
              - switch.adaptive_lighting_sleep_mode_toilet
              - switch.adaptive_lighting_sleep_mode_office
              - switch.adaptive_lighting_sleep_mode_staircase

- alias: "Adaptive lighting: reset manual_control after 1 hour"
  id: adaptive_lighting_reset_manual_control_after_1_hour
  mode: parallel
  max: 200
  trigger:
    - platform: event
      event_type: adaptive_lighting.manual_control
  variables:
    light: "{{ trigger.event.data.entity_id }}"
    switch: "{{ trigger.event.data.switch }}"
  condition:
    - "{{ 'hallway' not in light and 'staircase' not in light }}"
    # adaptive-lighting ≥1.31.0 re-fires this event on every interval while a
    # light sits at a brightness/colour it did not set (e.g. changed from a Hue
    # dimmer/app). Without this guard one storm schedules hundreds of
    # parallel 1-hour-delayed runs.
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none
           or now() - (this.attributes.last_triggered | as_datetime)
              > timedelta(minutes=30) }}
  action:
    - delay: "01:00:00"
    - condition: template
      value_template: "{{ light in (state_attr(switch, 'manual_control') or []) }}"
    - condition: state
      entity_id: input_boolean.automatic_lights
      state: "on"
    - service: adaptive_lighting.set_manual_control
      data:
        entity_id: "{{ switch }}"
        lights: "{{ light }}"
        manual_control: false
    - service: notify.liam
      data:
        title: "Adaptive Lighting: manual_control reset"
        message: "{{ light }} is reset to not 'manually controlled'"

- alias: "Adaptive lighting: notify manual_control"
  id: adaptive_lighting_notify_manual_control
  mode: parallel
  max: 20
  trigger:
    - platform: event
      event_type: adaptive_lighting.manual_control
  variables:
    light: "{{ trigger.event.data.entity_id }}"
  condition:
    - "{{ 'hallway' not in light and 'staircase' not in light }}"
    # Rate-limit: the manual_control event repeats every `interval` (30 s)
    # for as long as the light stays at a non-adaptive brightness, so notify
    # at most once per 30 minutes instead of twice a minute.
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none
           or now() - (this.attributes.last_triggered | as_datetime)
              > timedelta(minutes=30) }}
  action:
    - service: notify.liam
      data:
        title: "Adaptive Lighting: manual_control"
        message: "{{ light }} is now 'manually controlled'"
